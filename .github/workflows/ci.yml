name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sos
          POSTGRES_PASSWORD: sos
          POSTGRES_DB: sos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sos" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sos:sos@localhost:5432/sos
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-secret
      SOS_USE_CELERY: "0"
      GROQ_API_KEY: ""          # tests mock the LLM; CI never calls Groq
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-${{ hashFiles('firstaid/vectorstore.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Build first-aid vector index
        run: python manage.py build_firstaid_index

      - name: Run tests
        run: python manage.py test --verbosity 2

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
