<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Community SOS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14; --panel: #121821; --panel-2: #18202b; --line: #232d3a;
      --text: #e6edf3; --muted: #8b98a7; --accent: #ff4d4f;
      --critical: #ff4d4f; --high: #ff9f1a; --medium: #f5c542; --low: #3ecf8e;
      --info: #4ea1ff; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.5 Inter, system-ui, sans-serif; }
    a { color: var(--info); text-decoration: none; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .muted { color: var(--muted); }
    .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
           padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600;
           cursor: pointer; transition: transform .05s, background .15s; }
    .btn:hover { background: #202a37; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #ff6668; }
    .btn-ok { background: var(--low); border-color: var(--low); color: #06210f; }
    input, textarea, select { width: 100%; background: var(--bg); color: var(--text);
           border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--info); border-color: transparent; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
            border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: .03em; border: 1px solid currentColor; }
    .sev-critical { color: var(--critical); } .sev-high { color: var(--high); }
    .sev-medium { color: var(--medium); } .sev-low { color: var(--low); }
    .sev-pending { color: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
